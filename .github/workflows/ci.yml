name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check . --output-format=github
        continue-on-error: true   # lint findings are reported but do not block the build

      - name: Test (pytest + coverage)
        run: pytest --cov=app --cov-report=xml --cov-report=term --junitxml=pytest-report.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semgrep (code)
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/flask --config p/secrets \
            --json --output semgrep-report.json . || true

      - name: Trivy (dependencies and secrets)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: trivy-report.json
          exit-code: "0"          # report only; gating is enabled in a later milestone

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            semgrep-report.json
            trivy-report.json

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    needs: [lint-and-test, security]   # only runs when the tests above pass
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t inventory-demo:${{ github.sha }} .

      - name: Run container and check /health
        run: |
          docker run -d --name inventory -p 5000:5000 inventory-demo:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs inventory
          exit 1
